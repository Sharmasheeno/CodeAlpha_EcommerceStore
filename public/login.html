<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopLite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Shop<span>Lite</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
      <span id="authLinks"></span>
    </nav>
  </header>

  <main class="container narrow">
    <form id="loginForm" class="form-card">
      <h1>Login</h1>
      <label>Email
        <input id="email" type="email" required autocomplete="email">
      </label>
      <label>Password
        <input id="password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn" type="submit">Login</button>
      <p id="formMsg" class="form-msg error"></p>
      <p class="muted">No account yet? <a id="toRegister" href="register.html">Register</a></p>
      <p class="muted">Demo account (after seeding): demo@shop.com / demo1234</p>
    </form>
  </main>

  <footer class="site-footer">ShopLite — CodeAlpha Full Stack Internship, Task 1: Simple E-commerce Store</footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
